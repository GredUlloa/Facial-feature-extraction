[project]
name = "facerec"
version = "0.1.1"
description = "Feature extraction for face recognition"
readme = "README.md"
authors = [
    { name = "GredUlloa" }
]
requires-python = "==3.8.*"

dependencies = [
    "numpy==1.24.4",
    "deepface==0.0.95",
    "opencv-python==4.12.0.88",
    "insightface==0.7.3",
    "scikit-learn==1.3.2",
    "onnxruntime==1.19.2",
]

[tool.uv]
required-environments = [
    # macOS en Apple Silicon (ARM)
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    # Linux en x86_64
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    # Windows en x86_64
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]   
